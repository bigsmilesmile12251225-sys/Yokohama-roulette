<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a4f">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハーバールーレット">
<meta name="robots" content="noindex">
<title>横浜バス旅行 ハーバー争奪ルーレット</title>
<style>
  :root {
    --navy: #0a2a4f;
    --marine: #0e5fa8;
    --blue2: #1676c2;
    --sky: #e9f3fb;
    --red: #d7263d;
    --red-dark: #a8172b;
    --gold: #e3b341;
    --gold2: #f6d77a;
    --white: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background-color: var(--navy);
    color: var(--white);
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  button { font-family: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
  button:disabled { cursor: default; }
  [hidden] { display: none !important; }

  /* ---------- 設定（エントリー）画面 ---------- */
  #setup {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #071d38 0%, #0b3d73 45%, #0e5fa8 100%);
    background-size: cover;
    background-position: center bottom;
  }
  #setup.active { display: block; }
  .setup-inner {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);
  }
  .title { text-align: center; flex: none; }
  .title .sub {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--gold2);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .15em;
  }
  .title .sub::before, .title .sub::after { content: ""; width: 34px; height: 2px; background: var(--gold); }
  .title h1 {
    margin: 2px 0 0;
    font-size: clamp(22px, 7.2vw, 32px);
    line-height: 1.25;
    font-weight: 900;
    letter-spacing: .03em;
    white-space: nowrap;
    text-shadow: 0 2px 0 var(--navy), 0 0 14px rgba(246, 215, 122, .35);
  }
  .title h1 .accent { color: var(--gold2); }

  .board {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(3, 18, 40, .62);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 10px 10px 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .board-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; flex: none; }
  .board-head .label { color: var(--gold2); font-size: 19px; font-weight: 900; letter-spacing: .12em; }
  .board-head .count { font-size: 16px; font-weight: 800; }
  .board-head .count b { font-size: 28px; color: var(--white); margin-right: 2px; }
  #chipsWrap { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; margin: 6px 0 8px; padding: 2px; -webkit-overflow-scrolling: touch; }
  #chips {
    --fs: 16px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
    font-size: var(--fs);
  }
  .chip {
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: .26em .4em;
    font-weight: 800;
    text-align: center;
    white-space: nowrap;
    line-height: 1.25;
    animation: pop .35s ease-out both;
  }
  .chip.wrap { white-space: normal; overflow-wrap: anywhere; }
  .chip.dup { background: #ffe1e5; border-color: var(--red); color: var(--red-dark); }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  #emptyMsg {
    height: 100%;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px dashed rgba(246, 215, 122, .6);
    border-radius: 14px;
    color: var(--sky);
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
    padding: 12px;
  }
  #emptyMsg .big { font-size: 22px; font-weight: 900; color: var(--gold2); }
  #dupWarn {
    flex: none;
    margin-bottom: 8px;
    background: #fdecee;
    border: 2px solid var(--red);
    color: var(--red-dark);
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
  }
  .board-actions { display: flex; gap: 8px; flex: none; }
  .paste-btn {
    flex: 1;
    min-height: 52px;
    border-radius: 26px;
    border: 2px solid var(--gold2);
    background: linear-gradient(180deg, #f6d77a, #e3b341);
    color: var(--navy);
    font-size: 18px;
    font-weight: 900;
  }
  .edit-btn {
    flex: none;
    min-height: 52px;
    padding: 0 18px;
    border-radius: 26px;
    border: 2px solid rgba(255, 255, 255, .7);
    background: rgba(255, 255, 255, .12);
    color: var(--white);
    font-size: 16px;
    font-weight: 800;
  }

  .panel {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 4px 12px;
    background: rgba(255, 255, 255, .96);
    color: var(--navy);
    border-radius: 16px;
    padding: 6px 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  .panel-item { display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .panel-item .name { font-size: 16px; font-weight: 800; white-space: nowrap; }
  .panel-item .note { display: block; font-size: 11px; font-weight: 600; color: #5a7590; }
  .panel-item.bgm { flex-direction: column; gap: 2px; min-height: 0; }
  .panel-item.bgm .name { font-size: 12px; color: #5a7590; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: var(--marine);
    color: var(--white);
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
  }
  .stepper button:disabled { background: #c8d6e3; border-color: #dde5ec; color: #f2f5f8; }
  .stepper .value { min-width: 60px; text-align: center; font-size: 16px; font-weight: 800; }
  .stepper .value b { font-size: 32px; color: var(--red); margin-right: 2px; }

  .switch { position: relative; display: inline-block; width: 56px; height: 34px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: #c8d6e3; border-radius: 999px; transition: background .2s; }
  .switch .slider::before {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    left: 4px; top: 4px;
    background: var(--white);
    border-radius: 50%;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
    transition: transform .2s;
  }
  .switch input:checked + .slider { background: var(--red); }
  .switch input:checked + .slider::before { transform: translateX(22px); }

  .go-btn {
    display: block;
    width: 100%;
    min-height: 66px;
    border-radius: 33px;
    border: 3px solid var(--gold);
    background: linear-gradient(180deg, #e8384e, var(--red-dark));
    color: var(--white);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: .08em;
    box-shadow: 0 5px 0 #6e0f1c, 0 9px 16px rgba(0, 0, 0, .3);
  }
  .go-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #6e0f1c, 0 4px 10px rgba(0, 0, 0, .3); }
  .go-btn:disabled { background: #8aa3bb; border-color: #a9bccf; box-shadow: none; color: #e6edf3; }
  #goBtn { flex: none; min-height: 60px; }
  #goReason { flex: none; text-align: center; font-size: 13px; color: var(--gold2); font-weight: 700; margin-top: -4px; }

  /* ---------- 抽選画面 ---------- */
  #lottery {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--navy);
  }
  #lottery.active { display: flex; }
  #stageWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    display: block;
    width: 300px; height: 533px;
    border-radius: 14px;
    box-shadow: 0 0 0 2px rgba(227, 179, 65, .6), 0 8px 24px rgba(0, 0, 0, .5);
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  #menuBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 10px);
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .35);
    background: rgba(3, 14, 32, .35);
    color: rgba(255, 255, 255, .7);
    font-size: 22px;
    line-height: 1;
    opacity: .6;
  }

  /* ---------- モーダル・トースト ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(3, 14, 32, .78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);
  }
  .modal-box {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
    background: var(--white);
    color: var(--navy);
    border-radius: 20px;
    border-top: 6px solid var(--gold);
    padding: 16px;
    text-align: center;
  }
  .modal-box h2 { margin: 0 0 10px; font-size: 20px; }
  .modal-box .go-btn { margin-top: 12px; min-height: 56px; font-size: 19px; }
  .help { font-size: 13px; color: #47617d; margin: 0 0 8px; line-height: 1.5; text-align: left; }
  .small-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: var(--sky);
    color: var(--marine);
    border: 2px solid #b9d3ea;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 16px;
    font-weight: 700;
    min-height: 48px;
  }
  textarea {
    width: 100%;
    height: 38vh;
    min-height: 160px;
    font-size: 16px; /* 16px未満だとiPhoneで自動ズームする */
    line-height: 1.6;
    color: var(--navy);
    border: 2px solid #b9d3ea;
    border-radius: 12px;
    padding: 10px 12px;
    resize: none;
    background: #f7fbff;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--marine); }
  .modal-row { display: flex; gap: 8px; }
  .modal-row .small-btn { flex: 1; }
  #toast {
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top) + 14px);
    transform: translateX(-50%);
    z-index: 20;
    width: max-content;
    max-width: calc(100% - 32px);
    background: rgba(3, 14, 32, .92);
    color: var(--white);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    pointer-events: none;
  }
  #toast.error { border-color: #ff6b7d; color: #ffd0d6; }
</style>
</head>
<body>

<!-- ===== 設定（エントリー）画面 ===== -->
<main id="setup" class="active">
  <div class="setup-inner">
    <header class="title">
      <div class="sub">横浜バス旅行</div>
      <h1><span class="accent">ハーバー</span>争奪ルーレット</h1>
    </header>

    <section class="board" aria-label="エントリー一覧">
      <div class="board-head">
        <span class="label">エントリー</span>
        <span class="count"><b id="count">0</b>名</span>
      </div>
      <div id="chipsWrap">
        <div id="emptyMsg">
          <span class="big">参加者を募集中！</span>
          <span>メモで名前（1行に1名）をコピーして<br>「名前を貼り付け」を押してください</span>
        </div>
        <div id="chips"></div>
      </div>
      <div id="dupWarn" hidden></div>
      <div class="board-actions">
        <button id="pasteBtn" class="paste-btn" type="button">📋 名前を貼り付け</button>
        <button id="editBtn" class="edit-btn" type="button">✎ 編集</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-item">
        <span class="name">当選人数<span id="targetNote" class="note" hidden></span></span>
        <div class="stepper">
          <button id="minusBtn" type="button" aria-label="当選人数を減らす">−</button>
          <div class="value"><b id="target">7</b>名</div>
          <button id="plusBtn" type="button" aria-label="当選人数を増やす">＋</button>
        </div>
      </div>
      <div class="panel-item bgm">
        <span class="name">♪ BGM</span>
        <label class="switch">
          <input id="bgmToggle" type="checkbox" aria-label="BGM" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <button id="goBtn" class="go-btn" type="button" disabled>抽選スタート！</button>
    <div id="goReason"></div>
  </div>
</main>

<!-- ===== 抽選画面 ===== -->
<div id="lottery">
  <div id="stageWrap">
    <canvas id="stage" width="720" height="1280"></canvas>
  </div>
  <button id="menuBtn" type="button" aria-label="メニュー">≡</button>
</div>

<!-- ===== 名前の編集 ===== -->
<div id="editModal" class="modal" hidden>
  <div class="modal-box">
    <h2>名前の編集</h2>
    <p id="editHint" class="help">1行に1名ずつ入力します。空行や前後のスペースは自動で無視します。</p>
    <textarea id="names" placeholder="参加者A&#10;参加者B&#10;参加者C" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="modal-row">
      <button id="editClearBtn" class="small-btn" type="button">すべて消す</button>
      <button id="editCancelBtn" class="small-btn" type="button">キャンセル</button>
    </div>
    <button id="editDoneBtn" class="go-btn" type="button">決定</button>
  </div>
</div>

<!-- ===== メニュー ===== -->
<div id="menuModal" class="modal" hidden>
  <div class="modal-box">
    <h2>メニュー</h2>
    <button id="menuBgmBtn" class="small-btn" type="button">♪ BGM オン</button>
    <button id="menuResetBtn" class="small-btn" type="button">最初からやり直す</button>
    <button id="menuCloseBtn" class="go-btn" type="button">閉じる</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
'use strict';

/* =========================================================
   定数・共通
   ========================================================= */
const $ = (id) => document.getElementById(id);
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif';
const W = 720, H = 1280;          // 描画用canvasの解像度（縦9:16）
const CX = 360, CY = 640, R = 290; // ルーレットの中心と半径
const TAU = Math.PI * 2;
const POINTER = -Math.PI / 2;      // 矢印の位置（真上）
const MAX_TARGET = 10;
const COL = {
  navy: '#0a2a4f', marine: '#0e5fa8', blue2: '#1676c2', light: '#7fc0ef', sky: '#e9f3fb',
  red: '#d7263d', redDark: '#a8172b', gold: '#e3b341', gold2: '#f6d77a', white: '#ffffff'
};

/* =========================================================
   乱数（crypto.getRandomValuesによる偏りのない抽選）
   ========================================================= */
// 0〜n-1の整数を一様に返す。剰余による偏りが出ないよう、端数の範囲は捨てて引き直す
function randomInt(n) {
  if (n <= 1) return 0;
  const RANGE = 0x100000000;
  const limit = RANGE - (RANGE % n);
  const buf = new Uint32Array(1);
  let v;
  do {
    crypto.getRandomValues(buf);
    v = buf[0];
  } while (v >= limit);
  return v % n;
}
// 0以上1未満の小数（演出用の止まる位置などに使う）
function randomFloat() {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] / 0x100000000;
}

/* =========================================================
   状態
   ========================================================= */
const state = {
  names: [],
  wanted: 7,          // ユーザーが選んだ当選人数
  target: 7,          // 実際の当選人数（参加者数で上限をかけた値）
  candidates: [],     // まだ当選していない人
  winners: [],
  phase: 'setup',     // setup | ready | spinning | stopping | result | list
  rot: 0,             // ルーレットの回転角
  spin: null,
  lastTick: 0,
  kick: 0,            // 矢印の揺れ
  resultAt: 0,
  listAt: 0,
  bgmOn: true,
  canAdvance: false,  // タップで次へ進めるか
  wheel: null,
  particles: []
};

/* =========================================================
   設定（エントリー）画面
   ========================================================= */
const chipsWrap = $('chipsWrap');
const chipsEl = $('chips');
const namesEl = $('names');

function parseNames(text) {
  return text.split(/\r\n|\r|\n/).map((s) => s.trim()).filter((s) => s.length > 0);
}

// 全角・半角や連続スペースの違いも同じ名前として扱う
function nameKey(n) {
  return n.normalize('NFKC').replace(/\s+/g, ' ').toLowerCase();
}

function findDuplicates(names) {
  const map = new Map();
  for (const n of names) {
    const key = nameKey(n);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(n);
  }
  return [...map.values()].filter((g) => g.length > 1);
}

// 名前を札のように並べる（animateがtrueなら1枚ずつ飛び出す演出）
function renderChips(animate) {
  const dupKeys = new Set(findDuplicates(state.names).map((g) => nameKey(g[0])));
  chipsEl.innerHTML = '';
  state.names.forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'chip' + (dupKeys.has(nameKey(n)) ? ' dup' : '');
    d.textContent = n;
    if (animate) d.style.animationDelay = Math.min(i * 35, 1200) + 'ms';
    else d.style.animation = 'none';
    chipsEl.appendChild(d);
  });
  $('emptyMsg').hidden = state.names.length > 0;
  fitChips();
}

// 札は名前の長さに関係なく1行に2枚。文字サイズは全員そろえ、名前は必ずフルネームで表示する
const MIN_CHIP_FS = 16;
function fitChips() {
  const n = state.names.length;
  if (!n || !$('setup').classList.contains('active')) return;
  const kids = [...chipsEl.children];
  const apply = (fs) => {
    chipsEl.style.setProperty('--fs', fs + 'px');
    kids.forEach((c) => c.classList.remove('wrap'));
  };
  // 1) スクロールなしで全員が1行に収まる、いちばん大きな文字
  for (let fs = 26; fs > MIN_CHIP_FS; fs--) {
    apply(fs);
    if (kids.every(nameFits) && chipsWrap.scrollHeight <= chipsWrap.clientHeight + 1) return;
  }
  // 2) 収まらなければ読みやすい大きさのままスクロールし、1行に入らない名前は札の中で折り返す
  apply(MIN_CHIP_FS);
  kids.filter((c) => !nameFits(c)).forEach((c) => c.classList.add('wrap'));
}

// 名前が札の中に1行で入るか（小数点以下まで正確に測る）
// 札が飛び出すアニメーション中は縮小されているので、その倍率で割り戻して実寸にする
const measureRange = document.createRange();
function nameFits(c) {
  measureRange.selectNodeContents(c);
  const scale = c.offsetWidth ? c.getBoundingClientRect().width / c.offsetWidth : 1;
  const textW = measureRange.getBoundingClientRect().width / (scale || 1);
  const cs = getComputedStyle(c);
  const avail = c.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return avail >= textW + 1;
}

// 貼り付け後、枠の中をゆっくり下までスクロールして全員を見せ、最後に上へ戻す
let autoScroll = null;
function stopAutoScroll() {
  if (!autoScroll) return;
  clearTimeout(autoScroll.timer);
  cancelAnimationFrame(autoScroll.raf);
  autoScroll = null;
}
function startAutoScroll(delay) {
  stopAutoScroll();
  chipsWrap.scrollTop = 0;
  const job = { timer: 0, raf: 0 };
  autoScroll = job;
  const SPEED = 20;       // 下へ進む速さ（px/秒）
  const HOLD = 2500;      // 一番下で止まる時間（ミリ秒）
  const BACK = 2000;      // 上へ戻る時間（ミリ秒）
  const ease = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
  job.timer = setTimeout(() => {
    const max = chipsWrap.scrollHeight - chipsWrap.clientHeight;
    if (max <= 2) { autoScroll = null; return; }
    const down = Math.max(3000, max / SPEED * 1000);
    const t0 = performance.now();
    const step = (now) => {
      if (autoScroll !== job) return;
      const t = now - t0;
      if (t < down) chipsWrap.scrollTop = max * ease(t / down);
      else if (t < down + HOLD) chipsWrap.scrollTop = max;
      else if (t < down + HOLD + BACK) chipsWrap.scrollTop = max * (1 - ease((t - down - HOLD) / BACK));
      else { chipsWrap.scrollTop = 0; autoScroll = null; return; }
      job.raf = requestAnimationFrame(step);
    };
    job.raf = requestAnimationFrame(step);
  }, delay);
}
// 指で触ったら自動スクロールはやめる

function updateSetup() {
  const n = state.names.length;
  $('count').textContent = n;

  const dups = findDuplicates(state.names);
  const dupEl = $('dupWarn');
  if (dups.length) {
    dupEl.hidden = false;
    dupEl.textContent = '⚠ 同じ名前があります：' + dups.map((g) => '「' + g[0] + '」').join('') + '（赤い札）。「編集」で直してください。';
  } else {
    dupEl.hidden = true;
  }

  // 名前を入れる前は1〜10名で選べ、入れた後は参加者数までに抑える
  const upper = n ? Math.min(MAX_TARGET, n) : MAX_TARGET;
  state.target = Math.min(state.wanted, upper);
  $('target').textContent = state.target;
  $('minusBtn').disabled = state.target <= 1;
  $('plusBtn').disabled = state.target >= upper;
  const note = $('targetNote');
  note.hidden = !(n > 0 && state.wanted > n);
  note.textContent = '参加者数に合わせています';

  $('pasteBtn').textContent = n ? '📋 貼り直す' : '📋 名前を貼り付け';

  let reason = '';
  if (n === 0) reason = '参加者の名前を貼り付けてください';
  else if (dups.length) reason = '重複している名前を直してください';
  $('goBtn').disabled = reason !== '';
  $('goReason').textContent = reason;
  $('goReason').hidden = reason === '';
}

/* =========================================================
   効果音（Web Audio APIで合成）
   ========================================================= */
const Sound = {
  ctx: null, master: null, out: null, noise: null,

  // iPhoneはボタン操作の中でAudioContextを作成・再開しないと音が出ないため、各ボタンで呼ぶ
  ensure() {
    if (!this.ctx) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 未対応なら無視 */ }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.out = this.ctx.createDynamicsCompressor();
      this.master.connect(this.out);
      this.out.connect(this.ctx.destination);
      // 無音を一度鳴らしてロックを解除
      const b = this.ctx.createBuffer(1, 1, 22050);
      const s = this.ctx.createBufferSource();
      s.buffer = b;
      s.connect(this.ctx.destination);
      s.start(0);
      // ノイズ素材
      const len = Math.floor(this.ctx.sampleRate * 2);
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },

  ready() { return this.ctx && this.ctx.state === 'running'; },

  tick() {
    if (!this.ready()) return;
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = this.noise;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 3000;
    bp.Q.value = 1.4;
    const g = c.createGain();
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.5); src.stop(t + 0.05);

    const o = c.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(1600, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.03);
    const g2 = c.createGain();
    g2.gain.setValueAtTime(0.12, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    o.connect(g2); g2.connect(this.master);
    o.start(t); o.stop(t + 0.04);
  },

  brass(freq, start, dur, vol) {
    const c = this.ctx;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 2, start);
    lp.frequency.linearRampToValueAtTime(freq * 6, start + 0.05);
    lp.frequency.linearRampToValueAtTime(freq * 3.5, start + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.025);
    g.gain.linearRampToValueAtTime(vol * 0.75, start + Math.max(0.06, dur * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur + 0.12);
    lp.connect(g); g.connect(this.master);
    for (const det of [1, 1.006]) {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq * det;
      o.connect(lp);
      o.start(start); o.stop(start + dur + 0.15);
    }
  },

  bell(freq, start, vol) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
    o.connect(g); g.connect(this.master);
    o.start(start); o.stop(start + 0.65);
  },

  crash(start, vol, len) {
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this.noise;
    const hp = c.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 5000;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + len);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(start); src.stop(start + len + 0.05);
  },

  timpani(start, vol) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, start);
    o.frequency.exponentialRampToValueAtTime(90, start + 0.5);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.8);
    o.connect(g); g.connect(this.master);
    o.start(start); o.stop(start + 0.85);
  },

  // 回転中のドラムロール（ノイズを細かく刻み、だんだん大きくする）
  drumrollStart(duration) {
    if (!this.ready()) return;
    this.drumrollStop();
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2200;
    bp.Q.value = 0.7;
    // 下降のこぎり波で音量を揺らし、スネアを連打しているように聞かせる
    const am = c.createGain();
    am.gain.value = 0.5;
    const lfo = c.createOscillator();
    lfo.type = 'sawtooth';
    lfo.frequency.setValueAtTime(15, t);
    lfo.frequency.linearRampToValueAtTime(22, t + duration);
    const lfoDepth = c.createGain();
    lfoDepth.gain.value = -0.5;
    lfo.connect(lfoDepth); lfoDepth.connect(am.gain);
    const env = c.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.12, t + 0.3);
    env.gain.linearRampToValueAtTime(0.32, t + duration);
    src.connect(bp); bp.connect(am); am.connect(env); env.connect(this.master);
    src.start(t); lfo.start(t);
    this.roll = { src: src, lfo: lfo, env: env };
  },

  drumrollStop() {
    if (!this.roll) return;
    const { src, lfo, env } = this.roll;
    this.roll = null;
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    env.gain.cancelScheduledValues(t);
    env.gain.setValueAtTime(env.gain.value, t);
    env.gain.linearRampToValueAtTime(0.0001, t + 0.08);
    src.stop(t + 0.1); lfo.stop(t + 0.1);
  },

  // オリジナルのファンファーレ風フレーズ
  fanfare() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime + 0.03;
    const N = { G4: 392.0, C5: 523.25, E5: 659.25, G5: 783.99, C6: 1046.5, E6: 1318.5, G6: 1568.0, C7: 2093.0 };
    const seq = [
      ['G4', 0.00, 0.10], ['C5', 0.11, 0.10], ['E5', 0.22, 0.10], ['G5', 0.33, 0.26],
      ['E5', 0.64, 0.11], ['G5', 0.78, 0.11], ['C6', 0.92, 1.30]
    ];
    for (const [n, s, d] of seq) this.brass(N[n], t + s, d, 0.22);
    // 最後の音に和音を重ねる
    this.brass(N.G5, t + 0.92, 1.3, 0.13);
    this.brass(N.E5, t + 0.92, 1.3, 0.13);
    this.brass(N.C5, t + 0.92, 1.3, 0.12);
    this.timpani(t + 0.92, 0.6);
    this.crash(t + 0.92, 0.35, 1.4);
    // キラキラ
    [N.C6, N.E6, N.G6, N.C7, N.G6, N.C7].forEach((f, i) => this.bell(f, t + 1.05 + i * 0.09, 0.07));
  }
};

/* =========================================================
   BGM（港をイメージしたゆったりした3拍子のオリジナル曲を合成）
   ========================================================= */
const Bgm = {
  BPM: 84,
  LOOP_BEATS: 24, // 3拍子×8小節
  VOLUME: 0.32,
  events: null, gain: null, wave: null, timer: 0, loopStart: 0, idx: 0, playing: false,

  // 曲データ：[拍, 種類, 音名, 長さ(拍)]
  buildSong() {
    const f = (name) => {
      const m = /^([A-G])(#?)(\d)$/.exec(name);
      const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
      return 440 * Math.pow(2, (semi + (Number(m[3]) - 4) * 12 - 9) / 12);
    };
    const ev = [];
    // コード進行（1小節ずつ）：低音と、波のように上下するアルペジオ
    const chords = [
      ['C3', ['C4', 'G4', 'E5', 'G4', 'C5', 'G4']],
      ['A2', ['A3', 'E4', 'C5', 'E4', 'A4', 'E4']],
      ['F2', ['F3', 'C4', 'A4', 'C4', 'F4', 'C4']],
      ['G2', ['G3', 'D4', 'B4', 'D4', 'G4', 'D4']],
      ['C3', ['C4', 'G4', 'E5', 'G4', 'C5', 'G4']],
      ['A2', ['A3', 'E4', 'C5', 'E4', 'A4', 'E4']],
      ['D3', ['D4', 'A4', 'F4', 'G3', 'D4', 'B4']],
      ['C3', ['C4', 'G4', 'E4', 'G4', 'C5', 'G4']]
    ];
    chords.forEach(([bass, arp], bar) => {
      const b0 = bar * 3;
      ev.push([b0, 'bass', f(bass), 2.8]);
      arp.forEach((n, i) => ev.push([b0 + i * 0.5, 'harp', f(n), 1.2]));
    });
    // メロディ
    const melody = [
      ['E5', 2], ['D5', 1], ['C5', 2], ['A4', 1], ['C5', 1], ['D5', 1], ['F5', 1], ['E5', 2], ['D5', 1],
      ['E5', 2], ['G5', 1], ['A5', 2], ['G5', 1], ['F5', 1], ['E5', 1], ['D5', 1], ['C5', 3]
    ];
    let b = 0;
    for (const [n, d] of melody) { ev.push([b, 'lead', f(n), d]); b += d; }
    ev.sort((x, y) => x[0] - y[0]);
    return ev;
  },

  init() {
    const c = Sound.ctx;
    if (!c || this.gain) return;
    this.events = this.buildSong();
    this.gain = c.createGain();
    this.gain.gain.value = 0.0001;
    this.gain.connect(Sound.master);
  },

  play(e, t) {
    const c = Sound.ctx;
    const beat = 60 / this.BPM;
    const [, kind, freq, len] = e;
    const dur = len * beat;
    const o = c.createOscillator();
    const g = c.createGain();
    if (kind === 'harp') {
      o.type = 'triangle';
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } else if (kind === 'bass') {
      o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } else {
      // フルートのようなやわらかい音（少しビブラート）
      o.type = 'sine';
      const vib = c.createOscillator();
      const vibDepth = c.createGain();
      vib.frequency.value = 5;
      vibDepth.gain.value = freq * 0.006;
      vib.connect(vibDepth); vibDepth.connect(o.frequency);
      vib.start(t); vib.stop(t + dur + 0.1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.06);
      g.gain.setValueAtTime(0.2, t + dur * 0.7);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.05);
    }
    o.frequency.value = freq;
    o.connect(g); g.connect(this.gain);
    o.start(t); o.stop(t + dur + 0.1);
  },

  // 少し先までの音をまとめて予約する
  schedule() {
    const c = Sound.ctx;
    const beat = 60 / this.BPM;
    const horizon = c.currentTime + 0.4;
    for (;;) {
      const e = this.events[this.idx];
      const t = this.loopStart + e[0] * beat;
      if (t > horizon) break;
      if (t >= c.currentTime - 0.05) this.play(e, t);
      this.idx++;
      if (this.idx >= this.events.length) {
        this.idx = 0;
        this.loopStart += this.LOOP_BEATS * beat;
      }
    }
  },

  // 波の音（ゆっくり大きくなったり小さくなったりするノイズ）
  startWave() {
    const c = Sound.ctx;
    const src = c.createBufferSource();
    src.buffer = Sound.noise;
    src.loop = true;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 450;
    const g = c.createGain();
    g.gain.value = 0.05;
    const lfo = c.createOscillator();
    lfo.frequency.value = 0.12;
    const depth = c.createGain();
    depth.gain.value = 0.04;
    lfo.connect(depth); depth.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(this.gain);
    src.start(); lfo.start();
    this.wave = { src: src, lfo: lfo };
  },

  start() {
    if (!Sound.ready() || this.playing) return;
    this.init();
    const c = Sound.ctx;
    this.playing = true;
    this.idx = 0;
    this.loopStart = c.currentTime + 0.1;
    this.startWave();
    this.gain.gain.cancelScheduledValues(c.currentTime);
    this.gain.gain.setValueAtTime(0.0001, c.currentTime);
    this.gain.gain.linearRampToValueAtTime(this.VOLUME, c.currentTime + 1.2);
    this.schedule();
    this.timer = setInterval(() => this.schedule(), 80);
  },

  stop(fade) {
    if (!this.playing) return;
    this.playing = false;
    clearInterval(this.timer);
    const c = Sound.ctx;
    const t = c.currentTime;
    const end = t + (fade === undefined ? 0.5 : fade);
    this.gain.gain.cancelScheduledValues(t);
    this.gain.gain.setValueAtTime(this.gain.gain.value, t);
    this.gain.gain.linearRampToValueAtTime(0.0001, end);
    if (this.wave) {
      this.wave.src.stop(end + 0.05);
      this.wave.lfo.stop(end + 0.05);
      this.wave = null;
    }
  }
};

// 今の場面でBGMを流すべきかどうかに合わせて、再生・停止する
let bgmResumeTimer = 0;
function syncBgm() {
  clearTimeout(bgmResumeTimer);
  const quietPhase = state.phase === 'setup' || state.phase === 'spinning' || state.phase === 'stopping';
  if (!state.bgmOn || quietPhase) {
    Bgm.stop(state.phase === 'spinning' ? 0.4 : 0.5);
  } else if (Sound.ready()) {
    Bgm.start();
  } else if (Sound.ctx) {
    // iPhoneでは音の再開が少し遅れることがあるので、再開を待ってから流す
    Sound.ctx.resume().then(() => { if (Sound.ready()) syncBgm(); }).catch(() => {});
  }
}

function updateBgmLabel() {
  $('menuBgmBtn').textContent = state.bgmOn ? '♪ BGM オン（タップでオフ）' : '♪ BGM オフ（タップでオン）';
}

/* =========================================================
   描画
   ========================================================= */
const canvas = $('stage');
const ctx = canvas.getContext('2d');

function font(size, weight) { return (weight || 800) + ' ' + Math.round(size) + 'px ' + FONT; }

function roundRect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
}

// 幅に収まる文字サイズを求め、最小サイズでも入らなければ末尾を「…」にする
function fitText(g, text, maxW, maxSize, minSize, weight) {
  let size = maxSize;
  g.font = font(size, weight);
  const w = g.measureText(text).width;
  if (w > maxW) {
    size = Math.max(minSize, Math.floor(size * maxW / w));
    g.font = font(size, weight);
  }
  let t = text;
  if (g.measureText(t).width > maxW) {
    const chars = Array.from(text);
    while (chars.length > 1 && g.measureText(chars.join('') + '…').width > maxW) chars.pop();
    t = chars.join('') + '…';
  }
  return { size: size, text: t };
}

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const clamp01 = (v) => Math.max(0, Math.min(1, v));

/* ---------- 背景（事前に1回だけ描画） ---------- */
function buildBackground() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#071d38');
  grd.addColorStop(0.45, '#0b3d73');
  grd.addColorStop(0.85, '#0e5fa8');
  grd.addColorStop(1, '#0b4f8a');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);

  // 星
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 60; i++) {
    const x = rnd() * W, y = rnd() * 420;
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + rnd() * 0.5) + ')';
    g.beginPath(); g.arc(x, y, 0.8 + rnd() * 1.8, 0, TAU); g.fill();
  }

  // ルーレット背後の光
  const glow = g.createRadialGradient(CX, CY, R * 0.6, CX, CY, R * 1.55);
  glow.addColorStop(0, 'rgba(127,192,239,0.35)');
  glow.addColorStop(1, 'rgba(127,192,239,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, W, H);

  // 横浜の港のシルエット
  const base = 1195;
  g.fillStyle = 'rgba(3,18,40,0.6)';
  g.strokeStyle = 'rgba(3,18,40,0.6)';
  [[0, 1150, 60], [60, 1132, 46], [236, 1142, 64], [418, 1122, 46], [596, 1138, 30], [668, 1148, 52]]
    .forEach(([x, top, w]) => g.fillRect(x, top, w, base - top));
  // ランドマーク風の高層ビル
  g.beginPath(); g.moveTo(505, base); g.lineTo(516, 1012); g.lineTo(560, 1012); g.lineTo(571, base); g.closePath(); g.fill();
  g.fillRect(523, 998, 30, 16);
  // クイーンズ風の3棟
  g.fillRect(462, 1080, 36, base - 1080);
  g.fillRect(578, 1066, 16, base - 1066);
  // 帆の形のホテル
  g.beginPath(); g.moveTo(300, base); g.quadraticCurveTo(298, 1088, 368, 1066); g.lineTo(386, 1066);
  g.quadraticCurveTo(402, 1120, 410, base); g.closePath(); g.fill();
  // マリンタワー風
  g.beginPath(); g.moveTo(628, base); g.lineTo(636, 1048); g.lineTo(646, 1048); g.lineTo(654, base); g.closePath(); g.fill();
  g.fillRect(626, 1036, 30, 14);
  g.lineWidth = 3; g.beginPath(); g.moveTo(641, 1036); g.lineTo(641, 1010); g.stroke();
  // 観覧車
  const fx = 150, fy = 1102, fr = 76;
  g.lineWidth = 5; g.beginPath(); g.arc(fx, fy, fr, 0, TAU); g.stroke();
  g.lineWidth = 2;
  for (let i = 0; i < 16; i++) {
    const a = i * TAU / 16;
    g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + Math.cos(a) * fr, fy + Math.sin(a) * fr); g.stroke();
    g.beginPath(); g.arc(fx + Math.cos(a) * fr, fy + Math.sin(a) * fr, 5, 0, TAU); g.fill();
  }
  g.lineWidth = 6;
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx - 40, base); g.moveTo(fx, fy); g.lineTo(fx + 40, base); g.stroke();

  // 海
  const sea = g.createLinearGradient(0, base, 0, H);
  sea.addColorStop(0, '#0a3b6c');
  sea.addColorStop(1, '#062645');
  g.fillStyle = sea;
  g.fillRect(0, base, W, H - base);
  g.strokeStyle = 'rgba(255,255,255,0.22)';
  g.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const y0 = base + 16 + k * 20;
    g.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = y0 + Math.sin(x / 34 + k * 1.7) * 4;
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  // 水面の光
  g.fillStyle = 'rgba(246,215,122,0.35)';
  [[520, 1212, 40], [540, 1236, 26], [150, 1220, 34], [380, 1214, 28], [640, 1228, 22]]
    .forEach(([x, y, w]) => g.fillRect(x, y, w, 3));

  return c;
}

// ルーレットの台座と影（一覧画面では描かないので背景とは別にする）
function buildWheelBase() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.shadowColor = 'rgba(0,0,0,0.5)';
  g.shadowBlur = 34;
  g.shadowOffsetY = 14;
  g.fillStyle = COL.navy;
  g.beginPath(); g.arc(CX, CY, R + 26, 0, TAU); g.fill();
  return c;
}

/* ---------- ルーレット盤（参加者が変わるたびに描画） ---------- */
let wheelCanvas = null;
function buildWheel(names) {
  const size = R * 2 + 4;
  // 毎回canvasを作り直さず、同じものを消して描き直す
  if (!wheelCanvas) {
    wheelCanvas = document.createElement('canvas');
    wheelCanvas.width = size; wheelCanvas.height = size;
  }
  const c = wheelCanvas;
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, size, size);
  g.translate(size / 2, size / 2);
  const n = names.length;
  const a = TAU / n;
  const colors = [];
  for (let i = 0; i < n; i++) {
    if (n > 1 && n % 2 === 1 && i === n - 1) colors.push({ bg: COL.light, fg: COL.navy });
    else if (i % 2 === 0) colors.push({ bg: COL.marine, fg: COL.white });
    else colors.push({ bg: COL.white, fg: COL.navy });
  }
  for (let i = 0; i < n; i++) {
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, R, i * a, (i + 1) * a);
    g.closePath();
    g.fillStyle = colors[i].bg;
    g.fill();
  }
  // 立体感
  const shade = g.createRadialGradient(0, 0, R * 0.3, 0, 0, R);
  shade.addColorStop(0, 'rgba(255,255,255,0.10)');
  shade.addColorStop(0.85, 'rgba(0,0,0,0)');
  shade.addColorStop(1, 'rgba(0,0,0,0.18)');
  g.fillStyle = shade;
  g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  // 区切り線
  if (n > 1) {
    g.strokeStyle = COL.gold;
    g.lineWidth = n > 20 ? 2 : 3;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(Math.cos(i * a) * R, Math.sin(i * a) * R);
      g.stroke();
    }
  }
  // 名前（人数に応じて文字サイズを自動調整）
  const outer = R - 20;
  const inner = 80;
  const maxW = outer - inner;
  const mid = (outer + inner) / 2;
  const baseSize = n < 3 ? 52 : Math.max(14, Math.min(52, 2 * mid * Math.sin(a / 2) * 0.8));
  g.textAlign = 'right';
  g.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    g.save();
    g.rotate((i + 0.5) * a);
    const f = fitText(g, names[i], maxW, baseSize, 14, 800);
    g.fillStyle = colors[i].fg;
    g.fillText(f.text, outer, 1);
    g.restore();
  }
  return { canvas: c, size: size, n: n, a: a };
}

function drawAnchor(g, x, y, s, color) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  g.strokeStyle = color;
  g.lineWidth = 5;
  g.lineCap = 'round';
  g.beginPath(); g.arc(0, -24, 7, 0, TAU); g.stroke();
  g.beginPath(); g.moveTo(0, -17); g.lineTo(0, 27); g.stroke();
  g.beginPath(); g.moveTo(-14, -8); g.lineTo(14, -8); g.stroke();
  g.beginPath(); g.arc(0, 4, 23, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
  g.beginPath();
  g.moveTo(Math.cos(Math.PI * 0.15) * 23 + 6, Math.sin(Math.PI * 0.15) * 23 + 4 - 6);
  g.lineTo(Math.cos(Math.PI * 0.15) * 23, Math.sin(Math.PI * 0.15) * 23 + 4);
  g.lineTo(Math.cos(Math.PI * 0.15) * 23 - 8, Math.sin(Math.PI * 0.15) * 23 + 4 - 2);
  g.moveTo(-Math.cos(Math.PI * 0.15) * 23 - 6, Math.sin(Math.PI * 0.15) * 23 + 4 - 6);
  g.lineTo(-Math.cos(Math.PI * 0.15) * 23, Math.sin(Math.PI * 0.15) * 23 + 4);
  g.lineTo(-Math.cos(Math.PI * 0.15) * 23 + 8, Math.sin(Math.PI * 0.15) * 23 + 4 - 2);
  g.stroke();
  g.restore();
}

function drawWheel(now) {
  ctx.drawImage(wheelBaseCanvas, 0, 0);
  const wh = state.wheel;
  if (wh) {
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(state.rot);
    ctx.drawImage(wh.canvas, -wh.size / 2, -wh.size / 2);
    ctx.restore();
  }
  // 金の縁
  const ring = ctx.createLinearGradient(CX - R, CY - R, CX + R, CY + R);
  ring.addColorStop(0, '#f6d77a');
  ring.addColorStop(0.5, '#c8952a');
  ring.addColorStop(1, '#f6d77a');
  ctx.lineWidth = 24;
  ctx.strokeStyle = ring;
  ctx.beginPath(); ctx.arc(CX, CY, R + 10, 0, TAU); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.strokeStyle = COL.navy;
  ctx.beginPath(); ctx.arc(CX, CY, R + 22, 0, TAU); ctx.stroke();
  // 電飾
  const bulbs = 24;
  let step;
  if (state.phase === 'spinning') step = Math.floor(now / 70);
  else if (state.phase === 'result' || state.phase === 'stopping') step = Math.floor(now / 220) * 2;
  else step = Math.floor(now / 500);
  for (let i = 0; i < bulbs; i++) {
    const ang = i * TAU / bulbs;
    const x = CX + Math.cos(ang) * (R + 10), y = CY + Math.sin(ang) * (R + 10);
    const on = state.phase === 'spinning' ? (i + step) % 3 === 0 : (i + step) % 2 === 0;
    ctx.fillStyle = on ? '#fffbe0' : '#9a6d16';
    ctx.beginPath(); ctx.arc(x, y, on ? 6.5 : 5, 0, TAU); ctx.fill();
    if (on) {
      ctx.fillStyle = 'rgba(255,240,170,0.35)';
      ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
    }
  }
  // 中央
  ctx.fillStyle = COL.white;
  ctx.beginPath(); ctx.arc(CX, CY, 64, 0, TAU); ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = COL.gold;
  ctx.stroke();
  ctx.fillStyle = COL.red;
  ctx.beginPath(); ctx.arc(CX, CY, 48, 0, TAU); ctx.fill();
  drawAnchor(ctx, CX, CY + 1, 1, COL.white);

  // 矢印（区切りに当たると揺れる）
  const px = CX, py = CY - R - 34;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-state.kick * 0.35);
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.beginPath();
  ctx.moveTo(-30, -8);
  ctx.lineTo(30, -8);
  ctx.lineTo(0, 60);
  ctx.closePath();
  ctx.fillStyle = COL.red;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 4;
  ctx.strokeStyle = COL.white;
  ctx.stroke();
  ctx.fillStyle = COL.gold;
  ctx.beginPath(); ctx.arc(0, -8, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = COL.white;
  ctx.beginPath(); ctx.arc(0, -8, 5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStatus(now) {

/* ---------- 紙吹雪 ---------- */
function spawnParticles(count) {
  const colors = [COL.gold, COL.gold2, COL.red, COL.white, COL.light];
  state.particles = [];
  for (let i = 0; i < count; i++) {
    state.particles.push({
      x: Math.random() * W,
      y: -Math.random() * H * 0.8,
      vx: (Math.random() - 0.5) * 60,
      vy: 140 + Math.random() * 180,
      r: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 8,
      w: 10 + Math.random() * 10,
      h: 6 + Math.random() * 8,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}
function updateParticles(dt) {
  for (const p of state.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += p.vr * dt;
    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
  }
}
function drawParticles() {
  for (const p of state.particles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.r);
    ctx.scale(1, Math.abs(Math.cos(p.r * 1.3)) * 0.8 + 0.2);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
}

/* ---------- 当選表示 ---------- */
function drawResult(now) {
  const t = (now - state.resultAt) / 1000;
  ctx.fillStyle = 'rgba(4,18,40,' + Math.min(0.62, t * 2.5) + ')';
  ctx.fillRect(0, 0, W, H);

  // 回転する光
  ctx.save();
  ctx.translate(CX, 650);
  ctx.rotate(now / 3000);
  ctx.fillStyle = 'rgba(246,215,122,' + Math.min(0.18, t * 0.5) + ')';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-70, -900);
    ctx.lineTo(70, -900);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  drawParticles();

  const s = Math.max(0.02, easeOutBack(clamp01(t / 0.5)));
  const name = state.winners[state.winners.length - 1];
  const cw = 640, ch = 560;
  ctx.save();
  ctx.translate(CX, 650);
  ctx.scale(s, s);
  roundRect(ctx, -cw / 2, -ch / 2, cw, ch, 36);
  ctx.fillStyle = COL.white;
  ctx.fill();
  ctx.lineWidth = 12;
  ctx.strokeStyle = COL.gold;
  ctx.stroke();
  roundRect(ctx, -cw / 2 + 16, -ch / 2 + 16, cw - 32, ch - 32, 24);
  ctx.lineWidth = 2;
  ctx.strokeStyle = COL.marine;
  ctx.stroke();

  // リボン
  const ry = -ch / 2 + 34, rh = 92;
  ctx.fillStyle = COL.redDark;
  ctx.beginPath();
  ctx.moveTo(-cw / 2 - 30, ry + 14); ctx.lineTo(-cw / 2 + 10, ry + 14); ctx.lineTo(-cw / 2 + 10, ry + rh + 14);
  ctx.lineTo(-cw / 2 - 30, ry + rh + 14); ctx.lineTo(-cw / 2 - 10, ry + 14 + rh / 2); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cw / 2 + 30, ry + 14); ctx.lineTo(cw / 2 - 10, ry + 14); ctx.lineTo(cw / 2 - 10, ry + rh + 14);
  ctx.lineTo(cw / 2 + 30, ry + rh + 14); ctx.lineTo(cw / 2 + 10, ry + 14 + rh / 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = COL.red;
  ctx.fillRect(-cw / 2 + 4, ry, cw - 8, rh);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.white;
  ctx.font = font(52, 900);
  ctx.fillText(state.winners.length + '人目の当選者', 0, ry + rh / 2 + 2);

  // 名前
  const f = fitText(ctx, name, 560, 124, 30, 900);
  ctx.fillStyle = COL.navy;
  ctx.fillText(f.text, 0, -12);
  ctx.font = font(54, 800);
  ctx.fillStyle = COL.marine;
  ctx.fillText('さん', 0, 96);

  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-220, 150); ctx.lineTo(220, 150); ctx.stroke();
  drawAnchor(ctx, -250, 150, 0.6, COL.gold);
  drawAnchor(ctx, 250, 150, 0.6, COL.gold);

  ctx.font = font(42, 900);
  ctx.fillStyle = COL.red;
  ctx.fillText('ハーバー獲得おめでとう！', 0, 210);
  ctx.restore();

  if (t > 1.4 && Math.floor(now / 600) % 2 === 0) {
    ctx.font = font(34, 800);
    ctx.fillStyle = COL.gold2;
    ctx.fillText(state.winners.length < state.target ? 'タップで次の抽選へ ▶' : 'タップで当選者一覧へ ▶', CX, 1010);
  }
}

/* ---------- 当選者一覧 ---------- */
function drawList(now) {
  const t = (now - state.listAt) / 1000;
  const count = state.winners.length;
  const top = 352;
  const rowH = Math.min(100, (990 - top) / count); // 下にCongratulations!を出す場所を空けておく
  const boxH = rowH - 12;
  const panelBottom = top + count * rowH + 28;
  drawParticles();
  roundRect(ctx, 30, 256, 660, panelBottom - 256, 30);
  ctx.fillStyle = 'rgba(3,18,40,0.55)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(227,179,65,0.8)';
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = font(44, 900);
  ctx.fillStyle = COL.gold2;
  ctx.fillText('当選者発表', CX, 310);

  for (let i = 0; i < count; i++) {
    const e = easeOutCubic(clamp01((t - 0.3 - i * 0.25) / 0.4));
    if (e <= 0) continue;
    const y = top + i * rowH;
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate((1 - e) * 90, 0);
    roundRect(ctx, 56, y, 608, boxH, boxH / 2);
    ctx.fillStyle = COL.white;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = COL.gold;
    ctx.stroke();
    roundRect(ctx, 56, y, 160, boxH, boxH / 2);
    ctx.fillStyle = COL.red;
    ctx.fill();
    const fs = Math.min(44, boxH * 0.56);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.white;
    ctx.font = font(Math.min(34, boxH * 0.46), 900);
    ctx.fillText((i + 1) + '人目', 136, y + boxH / 2 + 1);
    ctx.textAlign = 'left';
    const sanW = fs * 1.9;
    const f = fitText(ctx, state.winners[i], 640 - 236 - sanW, fs, 16, 900);
    ctx.fillStyle = COL.navy;
    ctx.fillText(f.text, 236, y + boxH / 2 + 1);
    const nameW = ctx.measureText(f.text).width;
    ctx.font = font(fs * 0.7, 800);
    ctx.fillStyle = COL.marine;
    ctx.fillText('さん', 236 + nameW + 8, y + boxH / 2 + 3);
    ctx.restore();
  }
  // 全員が並び終わってから「Congratulations!」を出す
  drawCongrats(now, t - (0.3 + (count - 1) * 0.25 + 0.7), panelBottom + 105);
}

const SCRIPT_FONT = '"Snell Roundhand","Apple Chancery","Brush Script MT",Georgia,serif';

function drawSparkle(x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
  ctx.restore();
}

function drawCongrats(now, t, cy) {
  if (t <= 0) return;
  const k = clamp01(t / 0.7);
  const s = Math.max(0.02, easeOutBack(k));
  ctx.save();
  ctx.translate(CX, cy);
  ctx.scale(s, s);
  ctx.globalAlpha = Math.min(1, k * 1.5);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let size = 110;
  ctx.font = '700 ' + size + 'px ' + SCRIPT_FONT;
  const w = ctx.measureText('Congratulations!').width;
  if (w > 640) {
    size = Math.floor(size * 640 / w);
    ctx.font = '700 ' + size + 'px ' + SCRIPT_FONT;
  }
  const half = Math.min(w, 640) / 2;
  // 金色の上を光が流れるグラデーション
  const shine = ((now / 2200) % 1.6) - 0.3;
  const g = ctx.createLinearGradient(-half, 0, half, 0);
  g.addColorStop(0, '#c8952a');
  g.addColorStop(clamp01(shine - 0.12), '#f6d77a');
  g.addColorStop(clamp01(shine), '#fffbe0');
  g.addColorStop(clamp01(shine + 0.12), '#f6d77a');
  g.addColorStop(1, '#c8952a');
  ctx.lineJoin = 'round';
  ctx.lineWidth = 8;
  ctx.strokeStyle = COL.navy;
  ctx.strokeText('Congratulations!', 0, 0);
  ctx.shadowColor = 'rgba(246,215,122,0.8)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = g;
  ctx.fillText('Congratulations!', 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillText('Congratulations!', 0, 0);

  [[-300, -55, 16], [290, -62, 20], [-230, 50, 12], [320, 42, 14], [30, -80, 12], [-345, 10, 10]].forEach(([x, y, r], i) => {
    drawSparkle(x, y, r, 0.35 + 0.65 * Math.abs(Math.sin(now / 420 + i * 1.3)));
  });

  ctx.globalAlpha = clamp01((t - 0.4) / 0.5);
  ctx.font = font(40, 900);
  ctx.lineWidth = 8;
  ctx.strokeStyle = COL.navy;
  ctx.strokeText('当選おめでとうございます！', 0, 82);
  ctx.fillStyle = COL.white;
  ctx.fillText('当選おめでとうございます！', 0, 82);
  ctx.restore();
}

function render(now) {
  ctx.drawImage(bgCanvas, 0, 0);
  drawHeader();
  if (state.phase === 'list') {
    drawList(now);
  } else {
    drawWheel(now);
    drawStatus(now);
    if (state.phase === 'result') drawResult(now);
  }
}

/* =========================================================
   回転の制御
   ========================================================= */
function boundaryCount(rot, a) {
  return Math.floor((rot - POINTER) / a);
}

function startSpin() {
  if (state.phase !== 'ready') return;
  const n = state.candidates.length;
  const a = TAU / n;
  const winner = randomInt(n);             // 当選者をここで決める
  const offset = 0.12 + 0.76 * randomFloat(); // 区画内のどこで止まるか（境目は避ける）
  const spins = 5 + randomInt(3);          // 5〜7周
  const start = state.rot;
  // 停止時に矢印の下が当選者の区画になる角度を逆算する
  const base = POINTER - (winner + offset) * a;
  const delta = ((base - start) % TAU + TAU) % TAU;
  state.spin = {
    start: start,
    end: start + delta + spins * TAU,
    t0: performance.now(),
    duration: 6000 + randomInt(1500),
    a: a
  };
  state.lastTick = boundaryCount(start, a);
  state.phase = 'spinning';
  syncBgm();
  Sound.drumrollStart(state.spin.duration / 1000);
}

// 停止角度から矢印の下の区画を求める（表示と結果が必ず一致する）
function segmentAtPointer(rot, n) {
  const a = TAU / n;
  const rel = ((POINTER - rot) % TAU + TAU) % TAU;
  return Math.min(n - 1, Math.floor(rel / a));
}

function onSpinEnd() {
  state.phase = 'stopping';
  Sound.drumrollStop();
  setTimeout(() => {
    if (state.phase !== 'stopping') return;
    const idx = segmentAtPointer(state.rot, state.candidates.length);
    const name = state.candidates[idx];
    state.winners.push(name);
    state.candidates.splice(idx, 1);
    state.resultAt = performance.now();
    state.phase = 'result';
    spawnParticles(70);
    Sound.fanfare();
    armAdvance(1200); // 連打で進みすぎないよう少し待つ
    // ファンファーレが終わってからBGMを再開する
    bgmResumeTimer = setTimeout(() => { if (state.phase === 'result' || state.phase === 'list') syncBgm(); }, 2600);
  }, 450);
}

function update(now, dt) {
  if (state.phase === 'spinning' && state.spin) {
    const sp = state.spin;
    const t = clamp01((now - sp.t0) / sp.duration);
    state.rot = sp.start + (sp.end - sp.start) * easeOutCubic(t);
    const cnt = boundaryCount(state.rot, sp.a);
    if (cnt !== state.lastTick) {
      state.lastTick = cnt;
      state.kick = 1;
      Sound.tick();
    }
    if (t >= 1) {
      state.rot = sp.end;
      state.spin = null;
      onSpinEnd();
    }
  }
  state.kick *= Math.pow(0.002, dt);
  if (state.phase === 'result' || state.phase === 'list') updateParticles(dt);
}

let rafId = 0, lastFrame = 0;
function loop(now) {
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  update(now, dt);
  render(now);
  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   抽選画面の操作（ルーレットをタップして進める）
   ========================================================= */
let advanceTimer = 0;
function armAdvance(ms) {
  state.canAdvance = false;
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => { state.canAdvance = true; }, ms);
}

function advance() {
  if (!state.canAdvance) return;
  Sound.ensure();
  if (state.phase === 'ready') {
    state.canAdvance = false;
    startSpin();
  } else if (state.phase === 'result') {
    if (state.winners.length < state.target) {
      state.wheel = buildWheel(state.candidates);
      state.particles = [];
      state.phase = 'ready';
      armAdvance(400);
    } else {
      state.phase = 'list';
      state.listAt = performance.now();
      state.canAdvance = false;
      spawnParticles(50);
    }
    syncBgm();
  }
}

function fitStage() {
  const wrap = $('stageWrap');
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  if (!ww || !wh) return;
  let w = ww, h = w * H / W;
  if (h > wh) { h = wh; w = h * W / H; }
  canvas.style.width = Math.floor(w) + 'px';
  canvas.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(() => { fitStage(); fitChips(); }, 300));

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 未対応・拒否時は無視 */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.phase !== 'setup') requestWakeLock();
});

$('goBtn').addEventListener('click', () => {
  if ($('goBtn').disabled) return;
  stopAutoScroll();
  Sound.ensure();
  requestWakeLock();
  state.bgmOn = $('bgmToggle').checked;
  updateBgmLabel();
  state.candidates = state.names.slice();
  state.winners = [];
  state.rot = randomFloat() * TAU;
  state.wheel = buildWheel(state.candidates);
  state.phase = 'ready';
  state.particles = [];
  $('setup').classList.remove('active');
  $('lottery').classList.add('active');
  armAdvance(400);
  requestAnimationFrame(() => { fitStage(); setTimeout(fitStage, 300); });
  if (!rafId) { lastFrame = 0; rafId = requestAnimationFrame(loop); }
  syncBgm();
});

// 短くタップ：スタート／次へ　長押し：メニュー
let pressTimer = 0, pressStart = null;
canvas.addEventListener('pointerdown', (e) => {
  pressStart = { x: e.clientX, y: e.clientY };
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressStart = null; openMenu(); }, 700);
});
canvas.addEventListener('pointermove', (e) => {
  if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 15) {
    clearTimeout(pressTimer);
    pressStart = null;
  }
});
canvas.addEventListener('pointerup', () => {
  clearTimeout(pressTimer);
  if (pressStart) advance();
  pressStart = null;
});
canvas.addEventListener('pointercancel', () => { clearTimeout(pressTimer); pressStart = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- メニュー ---------- */
function openMenu() { $('menuModal').hidden = false; }
function closeMenu() { $('menuModal').hidden = true; }

function toggleBgm() {
  Sound.ensure();
  state.bgmOn = !state.bgmOn;
  $('bgmToggle').checked = state.bgmOn;
  updateBgmLabel();
  syncBgm();
}

function resetAll() {
  if (!confirm('最初からやり直しますか？\n（抽選結果は消えます。入力した名前は残ります）')) return;
  clearTimeout(advanceTimer);
  cancelAnimationFrame(rafId);
  rafId = 0;
  state.phase = 'setup';
  state.spin = null;
  state.canAdvance = false;
  Sound.drumrollStop();
  syncBgm();
  state.winners = [];
  state.candidates = [];
  state.particles = [];
  releaseWakeLock();
  closeMenu();
  $('lottery').classList.remove('active');
  $('setup').classList.add('active');
  updateSetup();
  renderChips(false);
}

$('menuBtn').addEventListener('click', openMenu);
$('menuBgmBtn').addEventListener('click', toggleBgm);
$('menuResetBtn').addEventListener('click', resetAll);
$('menuCloseBtn').addEventListener('click', closeMenu);

/* =========================================================
   初期化
   ========================================================= */
bgCanvas = buildBackground();
wheelBaseCanvas = buildWheelBase();
// 設定画面の背景にも、ルーレット画面と同じ港の夜景を使う
$('setup').style.backgroundImage = 'url(' + bgCanvas.toDataURL('image/png') + ')';
updateSetup();
updateBgmLabel();
</script>
</body>
